<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatGPT Token 登录器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a14;color:#e0e0e8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{max-width:560px;width:100%}
.logo{width:56px;height:56px;background:linear-gradient(135deg,#4a9eff,#6c5ce7);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff;margin:0 auto 16px}
h1{font-size:24px;text-align:center;margin-bottom:6px;background:linear-gradient(135deg,#4a9eff,#6c5ce7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:13px;color:#666;text-align:center;margin-bottom:28px}
.field{font-size:12px;color:#888;margin-bottom:6px}
textarea{width:100%;height:120px;padding:12px;border:1px solid #2a2a4a;border-radius:10px;background:#12121f;color:#eee;font-size:12px;font-family:Consolas,monospace;resize:none;transition:border-color .2s}
textarea:focus{outline:none;border-color:#4a9eff;box-shadow:0 0 0 2px rgba(74,158,255,.15)}
textarea::placeholder{color:#333}
.btn{width:100%;padding:13px;margin-top:14px;border:none;border-radius:10px;background:linear-gradient(135deg,#4a9eff,#6c5ce7);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.9}
.btn:active{transform:scale(.98)}
.btn2{background:#1a1a2e;border:1px solid #2a2a4a;color:#aaa;font-size:13px;padding:10px;margin-top:8px;display:none}
.btn2.show{display:block}
#msg{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.6;display:none;white-space:pre-wrap;word-break:break-all}
#msg.show{display:block}
#msg.ok{background:#0d2818;color:#4ade80;border:1px solid #166534}
#msg.err{background:#2d0a0a;color:#f87171;border:1px solid #991b1b}
#msg.warn{background:#2d2407;color:#fbbf24;border:1px solid #854d0e}
.steps{margin-top:24px;padding:20px;background:#12121f;border:1px solid #1e1e38;border-radius:10px;font-size:13px;line-height:2}
.steps .n{color:#4a9eff;font-weight:700}
code{background:rgba(74,158,255,.12);padding:2px 6px;border-radius:4px;font-size:12px;color:#4a9eff}
.foot{text-align:center;margin-top:24px;font-size:11px;color:#444}
</style>
</head>
<body>
<div class="box">
  <div class="logo">CG</div>
  <h1>ChatGPT Token 登录</h1>
  <p class="sub">粘贴 Session Token，一键生成登录脚本</p>

  <div class="field">Session Token / JSON 响应（都支持）</div>
  <textarea id="token" placeholder="支持以下格式：&#10;&#10;1. Cookie 值（__Secure-next-auth.session-token 的 Value）&#10;2. /api/auth/session 页面的完整 JSON（自动提取 sessionToken）"></textarea>

  <button class="btn" id="gen" onclick="generate()">生成登录脚本</button>
  <button class="btn2" id="copy" onclick="copyScript()">复制脚本到剪贴板</button>

  <div id="msg"></div>

  <div class="steps">
    <div><span class="n">1.</span> 粘贴 Token，点击「生成登录脚本」</div>
    <div><span class="n">2.</span> 点击「复制脚本到剪贴板」</div>
    <div><span class="n">3.</span> 打开 <code>https://chatgpt.com</code></div>
    <div><span class="n">4.</span> 按 <code>F12</code> → 切换到 <code>Console</code> 标签</div>
    <div><span class="n">5.</span> 粘贴脚本，按 <code>Enter</code> 运行</div>
    <div><span class="n">6.</span> 页面自动刷新，登录成功</div>
  </div>

  <div class="foot">获取 Token：F12 → Application → Cookies → chatgpt.com → __Secure-next-auth.session-token</div>
</div>

<script>
let script = '';

function generate() {
  const token = document.getElementById('token').value.trim();
  const msg = document.getElementById('msg');
  const copyBtn = document.getElementById('copy');
  const genBtn = document.getElementById('gen');

  msg.className = '';
  copyBtn.classList.remove('show');

  if (!token) { showMsg('请先粘贴 Token', 'err'); return; }

  let actualToken = token;
  let jsonInfo = '';

  if (token.startsWith('{')) {
    try {
      const json = JSON.parse(token);
      if (json.sessionToken) {
        actualToken = json.sessionToken;
        const email = json.user ? json.user.email : '未知';
        const plan = json.account ? json.account.planType : '未知';
        jsonInfo = '\n账号: ' + email + '  |  套餐: ' + plan;
      } else if (json.accessToken) {
        showMsg('JSON 中只找到 accessToken，未找到 sessionToken。\n\naccessToken 是 API 令牌，无法用于网页 Cookie 登录。\n\n请确保你复制的是 /api/auth/session 页面的完整内容，\n其中应包含 sessionToken 字段。', 'warn');
        return;
      } else {
        showMsg('JSON 中未找到 sessionToken 或 accessToken 字段', 'err');
        return;
      }
    } catch(e) {
      showMsg('JSON 解析失败: ' + e.message, 'err');
      return;
    }
  } else if (token.startsWith('eyJ') && token.split('.').length === 3) {
    showMsg('这是 JWT（accessToken），不是 sessionToken。\n\naccessToken 用于 API 调用，无法用于网页 Cookie 登录。\n\n请粘贴 /api/auth/session 页面的完整 JSON（包含 sessionToken 字段）。', 'warn');
    return;
  }

  // 生成设置 Cookie 的脚本
  const chunkSize = 2538;
  let cookieScript = '';

  // 先清除旧 Cookie
  cookieScript += "document.cookie='__Secure-next-auth.session-token=; path=/; domain=.chatgpt.com; Secure; SameSite=None; expires=Thu, 01 Jan 1970 00:00:00 GMT';\n";
  for (let i = 0; i < 20; i++) {
    cookieScript += `document.cookie='__Secure-next-auth.session-token.${i}=; path=/; domain=.chatgpt.com; Secure; SameSite=None; expires=Thu, 01 Jan 1970 00:00:00 GMT';\n`;
  }

  if (actualToken.length > chunkSize) {
    const chunks = [];
    for (let i = 0; i < actualToken.length; i += chunkSize) {
      chunks.push(actualToken.slice(i, i + chunkSize));
    }
    cookieScript += chunks.map((chunk, idx) =>
      `document.cookie='__Secure-next-auth.session-token.${idx}=${chunk}; path=/; domain=.chatgpt.com; Secure; SameSite=None';`
    ).join('\n');
  } else {
    cookieScript += `document.cookie='__Secure-next-auth.session-token=${actualToken}; path=/; domain=.chatgpt.com; Secure; SameSite=None';`;
  }

  script = cookieScript + '\nlocation.reload();';
  copyBtn.classList.add('show');
  showMsg('登录脚本已生成！' + jsonInfo + '\n\n点击下方「复制脚本到剪贴板」按钮\n然后打开 chatgpt.com → F12 → Console → 粘贴 → Enter', 'ok');
}

function copyScript() {
  navigator.clipboard.writeText(script).then(() => {
    const btn = document.getElementById('copy');
    const old = btn.textContent;
    btn.textContent = '已复制！去 chatgpt.com 控制台粘贴';
    setTimeout(() => { btn.textContent = old; }, 2000);
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = script;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showMsg('脚本已复制到剪贴板（备用方式）', 'ok');
  });
}

function showMsg(text, type) {
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = type + ' show';
}
</script>
</body>
</html>
